<object class='h3'  style='font-size:26px; color:#2F4F4F; font-weight:bold; line-height:100%; font-family:  Helvetica;'>Περί Εξομολόγησης</object>
<br><br>
Οι δύο πρώτες και σπουδαιότερες εντολές του Κυρίου είναι η αγάπη προς το Θεό και η αγάπη προς το συνάνθρωπο. Απο αυτές τις εντολές εξαρτώνται όλος ο νόμος και οι προφήτες. Η παράβαση αυτών αποτελούν και τις μεγαλύτερες αμαρτίες. <br><br>

Μὴ πλανᾶσθε·οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται οὔτε πλεονέκται οὔτε κλέπται οὔτε μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν Θεοῦ οὐ κληρονομήσουσι (ΠΡΟΣ ΚΟΡΙΝΘΙΟΥΣ Α’ Κεφάλαιο 6, στίχοι 9-10) <br><br>

«Αμαρτία αποτελεσθείσα αποκύει θάνατον» και «τα οψώνια της αμαρτίας θάνατος» (Ιακ. 1, 15. Ρωμ. 6, 23). <br><br>

Ο Απόστολος Πέτρος στις Πράξεις των αποστόλων 3/19, λέει στους Ιουδαίους που μίλησε στην Ιερουσαλήμ «Μετανοήσατε, λοιπόν και επιστρέψατε για να εξαλειφθούν οι αμαρτίες σας»<br><br>

Ο Ιησούς είπε: «μετανοείτε και πιστεύετε εις το ευαγγέλιο». (Μάρκ. 1/15)<br><br>

Εκείνος που μετανοεί κατά Θεόν σώζεται (π.χ οπως ο ληστής διπλα στο σταυρό) <br><br>

H παραβολή του ασώτου Υιού αποτελεί παράδειγμα μετανοίας<br><Br>

Η βλασφημία κατά του Αγίου Πνεύματος αποτελεί ασυγχώρητη αμαρτία (Ματθ. ιβ' 31-32.βλ. και Μάρκ. γ' 28-30, Λουκ. ιβ 10)<br><br>

Αμαρτία δεν αποτελεί μόνο η πράξη αλλά είναι και ο κακός λογισμός/σκέψη<br><br>

Τα αμαρτήματα χωρίζονται σε δύο κατηγορίες (θανάσιμα αμάρτηματα και συγγνωστά αμαρτήματα). Τα θανάσιμα αμαρτήματα είναι αυτά που οδηγούν στον αιώνιο και πνευματικό θάνατο την ψυχή. Συγγνωστά είναι αμαρτήματα ελαφρά, μικρές παραβάσεις του νόμου του Θεού, που δεν διώχνουν τη χάρη του από τον άνθρωπο και δεν τον αποκόπτουν από την λυτρωτική της ενέργεια. Έτσι μπορεί εύκολα να συγχωρηθούν από τον Θεό<Br><br>

Στην επιστολή Α'/9 του Ιωάννου αναφέρεται: "ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστι καὶ δίκαιος, ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικία"<br><br>

Η εξομολόγηση πρέπει να γίνεται πάντα σε φυσικό πρόσωπο (πχ ιερέα). Δεν δύναται να πραγματοποιηθεί μπροστά σε εικόνα/ξύλο.<br><br>

Στο κατά Ιωάννη ευαγγέλιο (20:23) αναφέρεται: "ἄν τινων ἀφῆτε τὰς ἁμαρτίας, ἀφίενται αὐτοῖς, ἄν τινων κρατῆτε, κεκράτηνται" δηλαδή σε μετάφραση "Αν συγχωρήσετε τις αμαρτίες κάποιου, συγχωρούνται· αν δεν τις συγχωρήσετε, δεν συγχωρούνται"<br><br>

Επίσης, ο κόσμος θα κριθεί για κάθε έργο/αμαρτία που έπραξε στη Δευτέρα Παρουσία (Αποκάλυψη Ιωάννου/20:12):
"καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν"<br><br>

Στο κατά Ματθαίον ευαγγέλιο (16:19) επίσης γίνεται αναφορά περί συγχωρήσεως των αμαρτιών: "καὶ δώσω σοι τὰς κλεῖς τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ἐὰν δήσῃς ἐπὶ τῆς γῆς, ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ἐὰν λύσῃς ἐπὶ τῆς γῆς, ἔσται λελυμένον ἐν τοῖς"<br><br>

Η εξομολόγηση πρέπει να γίνεται με συντριβή και ταπείνωση. Αμαρτάνουμε από εγωισμό και σωζόμαστε από ταπείνωση<br><br>

Κατά την εξομολόγηση αναφέρουμε κατ'είδος τις αμαρτίες χωρίς να κάνουμε γενικολογίες (π.χ δεν λέμε "έκανα όλες τις αμαρτίες")<br><br>

Επίσης, την ώρα της εξομολόγησης δεν πρέπει να καταβάλλουμε προσπάθεια να δικαιολογήσουμε τις αμαρτίες μας
